services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sigd
      POSTGRES_USER: sigd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigd -d sigd"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
